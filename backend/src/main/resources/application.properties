spring.application.name=calorie-backend
server.port=8081

# ---------- SQLite ----------
# The DB file is created next to wherever you run the app (calorie-backend folder).
spring.datasource.url=jdbc:sqlite:calorie_counter.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time; a single connection avoids "database is locked".
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Frontend ----------
# Serves calorie.html / script.js / styles.css straight from the frontend folder,
# so http://localhost:8081/ opens the app with no CORS setup needed.
app.frontend-dir=../frontend
spring.web.resources.static-locations=file:${app.frontend-dir}/,classpath:/static/

# Origins allowed to call /api/** when the frontend is served elsewhere (e.g. Vite on 5173).
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,null
